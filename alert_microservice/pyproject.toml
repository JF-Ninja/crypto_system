authors = [
    { name = "JFN", email = "eserikova22@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=10.0.1",
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
