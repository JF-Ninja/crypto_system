services:
  nginx-gateway:
    image: nginx:latest
    container_name: nginx-gateway
    ports:
      - "80:80"
    volumes:
      - ./infra/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - main_network
    depends_on:
      - alerts-app
      - assets-app
      - users-app

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    container_name: shared_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ./infra/.env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - main_network

  alerts-app:
    build: ./alert_microservice
    container_name: alerts_container
    env_file:
      - ./alert_microservice/.env
    environment:
      - ROOT_PATH=/api/v1/alerts
    networks:
      - main_network
    depends_on:
      - alerts-db
      - alerts-redis
      - rabbitmq

  alerts-db:
    image: postgres:16-alpine
    container_name: alerts_postgres_db
    ports:
      - "5433:5432"
    restart: always
    env_file:
      - ./alert_microservice/.env
    volumes:
      - alerts-postgres-data:/var/lib/postgresql/data
    networks:
      - main_network

  alerts-redis:
    image: redis:7-alpine
    container_name: alert_service_redis
    ports:
      - "6380:6379"
    env_file:
      - ./alert_microservice/.env
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    restart: always
    volumes:
      - alerts-redis-data:/data
    networks:
      - main_network

  assets-app:
    build: ./asset_microservice
    container_name: assets_container
    env_file:
      - ./asset_microservice/.env
    environment:
      - ROOT_PATH=/api/v1/assets
    networks:
      - main_network
    depends_on:
      - assets-redis
      - rabbitmq

  assets-redis:
    image: redis:7-alpine
    container_name: asset_service_redis
    ports:
      - "6381:6379"
    env_file:
      - ./asset_microservice/.env
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    restart: always
    volumes:
      - assets-redis-data:/data
    networks:
      - main_network

  users-app:
    build: ./user_microservice
    container_name: users_container
    env_file:
      - ./user_microservice/.env
    environment:
      - ROOT_PATH=/api/v1/users
    networks:
      - main_network
    depends_on:
      - users-db
      - users-redis

  users-db:
    image: postgres:16-alpine
    container_name: users_postgres_db
    ports:
      - "5432:5432"
    restart: always
    env_file:
      - ./user_microservice/.env
    volumes:
      - users-postgres-data:/var/lib/postgresql/data
    networks:
      - main_network

  users-redis:
    image: redis:7-alpine
    container_name: user_service_redis
    ports:
      - "6379:6379"
    env_file:
      - ./user_microservice/.env
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    restart: always
    volumes:
      - users-redis-data:/data
    networks:
      - main_network

volumes:
  rabbitmq-data:
  alerts-postgres-data:
  alerts-redis-data:
  assets-redis-data:
  users-postgres-data:
  users-redis-data:

networks:
  main_network:
    name: crypto_project_network
    driver: bridge
