services:
  nginx-gateway:
    image: nginx:latest
    container_name: nginx-gateway
    ports:
      - "80:80"
    volumes:
      - ./infra/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - main_network
    depends_on:
      - alerts-app
      - assets-app
      - users-app

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    container_name: shared_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ./infra/.env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - main_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 3s
      timeout: 3s
      retries: 5

  alerts-app:
    build: ./alert_microservice
    container_name: alerts_container
    restart: always
    env_file:
      - ./alert_microservice/.env
    environment:
      - ROOT_PATH=/api/v1/alerts
    networks:
      - main_network
    depends_on:
      alerts-db:
        condition: service_started
      alerts-redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./alert_microservice/logs:/app/logs

  alerts-db:
    image: postgres:16-alpine
    container_name: alerts_postgres_db
    ports:
      - "5433:5432"
    restart: always
    env_file:
      - ./alert_microservice/.env
    volumes:
      - alerts-postgres-data:/var/lib/postgresql/data
    networks:
      - main_network

  alerts-redis:
    image: redis:7-alpine
    container_name: alert_service_redis
    ports:
      - "6380:6379"
    env_file:
      - ./alert_microservice/.env
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    restart: always
    volumes:
      - alerts-redis-data:/data
    networks:
      - main_network

  assets-app:
    build: ./asset_microservice
    container_name: assets_container
    restart: always
    env_file:
      - ./asset_microservice/.env
    environment:
      - ROOT_PATH=/api/v1/assets
    networks:
      - main_network
    depends_on:
      assets-redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./asset_microservice/logs:/app/logs

  assets-redis:
    image: redis:7-alpine
    container_name: asset_service_redis
    ports:
      - "6381:6379"
    env_file:
      - ./asset_microservice/.env
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    restart: always
    volumes:
      - assets-redis-data:/data
    networks:
      - main_network

  users-app:
    build: ./user_microservice
    container_name: users_container
    restart: always
    env_file:
      - ./user_microservice/.env
    environment:
      - ROOT_PATH=/api/v1/users
    networks:
      - main_network
    depends_on:
      - users-db
      - users-redis
    volumes:
      - ./user_microservice/logs:/app/logs

  users-db:
    image: postgres:16-alpine
    container_name: users_postgres_db
    ports:
      - "5432:5432"
    restart: always
    env_file:
      - ./user_microservice/.env
    volumes:
      - users-postgres-data:/var/lib/postgresql/data
    networks:
      - main_network

  users-redis:
    image: redis:7-alpine
    container_name: user_service_redis
    ports:
      - "6379:6379"
    env_file:
      - ./user_microservice/.env
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    restart: always
    volumes:
      - users-redis-data:/data
    networks:
      - main_network

  loki:
    image: grafana/loki:3.0.0
    container_name: loki_container
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - main_network

  alloy:
    image: grafana/alloy:latest
    container_name: alloy_container
    volumes:
      - ./infra/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - ./user_microservice/logs:/var/log/app/user_microservice:ro
      - ./asset_microservice/logs:/var/log/app/asset_microservice:ro
      - ./alert_microservice/logs:/var/log/app/alert_microservice:ro
    command: run --storage.path=/tmp/alloy-pipelines /etc/alloy/config.alloy
    networks:
      - main_network
    depends_on:
      - loki
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_container
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
    networks:
      - main_network
    depends_on:
      - loki

volumes:
  rabbitmq-data:
  alerts-postgres-data:
  alerts-redis-data:
  assets-redis-data:
  users-postgres-data:
  users-redis-data:
  users-logs-volume:

networks:
  main_network:
    name: crypto_project_network
    driver: bridge
